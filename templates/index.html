<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        color: #1f2937;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 40px 48px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        text-align: center;
        max-width: 520px;
      }
      h1 {
        margin-top: 0;
        font-size: 2.2rem;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .badge {
        display: inline-block;
        background: #dbeafe;
        color: #1d4ed8;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Django Project</div>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <p>This is a new small update to keep the project active and ready for the next commit.</p>
    </div>
  </body>
</html>
